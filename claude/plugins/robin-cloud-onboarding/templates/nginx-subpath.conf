# nginx for an SPA served under a SUBPATH (ingress path "/<SUB>", e.g. /admin).
# Requires THREE coordinated changes (a base=/ SPA at a subpath = white screen):
#   1. Vite:   base: '/<SUB>/'                 → asset URLs become /<SUB>/assets/*
#   2. Router: BrowserRouter basename={import.meta.env.BASE_URL.replace(/\/$/,'')||'/'}
#   3. Docker: COPY dist → /usr/share/nginx/html/<SUB>   (files live under the prefix,
#              because the ingress forwards /<SUB> WITHOUT a rewrite)
# The API base (VITE_API_BASE_URL=/api/v1) is absolute+same-origin → unaffected.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;        # bundle lives at /usr/share/nginx/html/<SUB>
    index index.html;

    location /<SUB>/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Bare /<SUB> → /<SUB>/ so relative resolution + the fallback below match.
    location = /<SUB> {
        return 308 /<SUB>/;
    }

    location /<SUB>/ {
        try_files $uri $uri/ /<SUB>/index.html;
        add_header Cache-Control "no-store";
    }
}
