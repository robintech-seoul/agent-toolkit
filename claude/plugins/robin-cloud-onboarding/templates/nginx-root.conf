# nginx for an SPA served at the ROOT path (ingress path "/"). Vite base stays "/".
server {
    listen 8080;                       # Robin-Cloud containerPort
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA deep-link fallback. index.html must NOT be cached: asset hashes change on
    # each deploy, and a stale shell references /assets/* that now 404 (white screen).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
